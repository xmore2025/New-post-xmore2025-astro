<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="xmore">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e2a3a" />
      <stop offset="100%" stop-color="#0f1419" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ab2ee" />
      <stop offset="100%" stop-color="#5b8dd9" />
    </linearGradient>
  </defs>
  <!-- rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <!-- stylized X formed by two crossing strokes -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- left-up to right-down -->
    <path d="M18 18 L46 46" stroke="url(#accent)" stroke-width="4.5" />
    <!-- right-up to left-down -->
    <path d="M46 18 L18 46" stroke="#faf9f7" stroke-width="4.5" opacity="0.88" />
  </g>
  <!-- center dot accent -->
  <circle cx="32" cy="32" r="3.2" fill="#8ab2ee" />
  <!-- bottom-right "more" indicator: three dots -->
  <g fill="#8ab2ee" opacity="0.7">
    <circle cx="40" cy="52" r="1.8" />
    <circle cx="46" cy="52" r="1.8" />
    <circle cx="52" cy="52" r="1.8" />
  </g>
</svg>
