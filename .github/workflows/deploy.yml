name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一分支只保留最新一次部署
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      # 构建前的三道校验：字体子集是否覆盖内容 / 类型 / 代码风格
      - name: Check font subset
        run: npm run fonts:check

      - name: Type check
        run: npm run check

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name=new-post-xmore2025-astro \
            --branch=main \
            --commit-dirty=true

      - name: 缺少凭据时的提示
        if: env.CF_TOKEN == '' || env.CF_ACCOUNT == ''
        run: |
          echo "::notice title=跳过部署::未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，本次仅验证构建。"
